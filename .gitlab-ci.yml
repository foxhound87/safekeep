# Pipeline per safekeep: un job `test` in **matrix a 3 gambe** che esegue la
# suite di test + lo step E2E con le immagini ufficiali Python sul runner
# Linux standard di GitLab (SPEC.md §14.6).
#
# - matrix (0.3.1): `parallel: matrix` su `python:3.9-slim` (il floor di
#   `requires-python`), `python:3.12-slim` e `python:3.14-slim` — le stesse
#   tre versioni dei classifier PyPI di `pyproject.toml` e della matrix di
#   `.github/workflows/test.yml`. `publish`/`publish-test` fanno `needs: [test]`
#   → aspettano tutte e tre le gambe.
# - E2E (0.3.1): `tests/e2e_linux.sh` (daemon live + fswatch reale) gira in
#   ogni gamba, subito dopo la suite.
# - WSL (SPEC §17.2/§14.6): lo step finale `--doctor-only` esercita il ramo
#   WSL di `doctor` con `WSL_DISTRO_NAME=SafekeepCITest` sull'env del runner
#   (niente patch, niente dipendenze nuove: bash, grep, mktemp — già nelle
#   immagini -slim — e il fswatch installato qui sopra). Gate = marker
#   "WSL rilevato: SafekeepCITest" stampato + exit 0.
# - `procps` (0.3.1): le immagini `-slim` non contengono `pgrep`, che lo
#   script E2E usa per trovare il figlio del daemon → installato insieme a
#   `fswatch`. Verificato in locale su `python:3.9-slim` (Debian 13/trixie):
#   `fswatch` esiste nei repo, `pgrep` no, suite + E2E verdi.
#
# NOTA di portabilità (macOS → Linux), letta dai test prima di scriverla:
#
# - install-smoke (0.7.0): job dedicato che fa `bash tests/ci_daemon_install.sh`
#   — build della wheel, install in un venv pulito, HOME temporaneo,
#   `safekeep daemon install` → unit presente, nessun placeholder residuo,
#   config chmod 600, doctor best-effort. NESSUNA operazione che avvii o fermi
#   un agent (niente bootstrap/enable/start/stop/uninstall nel job; l'unica
#   chiamata di servizio è `systemctl --user daemon-reload`, best-effort).
#   Nel container slim NON c'è systemd → si esercita il ramo ERRORE WSL
#   (WSL_DISTRO_NAME + systemd assente → exit != 0 con /etc/wsl.conf) e il
#   ramo non-WSL-senza-systemd (warning + unit scritta, exit 0).
#
# - e2e SMB (0.9.0, SPEC §14.6/§20): `tests/e2e_smb.sh` monta un share CIFS
#   guest (smbd privato + mount.cifs) ed è il gate reale dei volumi di rete.
#   DIVERGENZA DICHIARATA (stessa prassi di pgrep/procps): il docker executor
#   di GitLab non ha SYS_ADMIN → mount.cifs NON può montare → su GitLab
#   niente e2e SMB. Il gate vive su GitHub Actions, gamba 3.12, con
#   `SAFEKEEP_E2E_SMB=1` (vedi header di `.github/workflows/test.yml`); qui
#   lo script senza quell'env salta con messaggio ed esce 0.
# - fswatch VIENE installato nel job (0.3.0): `doctor` ora cerca il monitor della
#   piattaforma (`fsevents_monitor` su Darwin, `inotify_monitor` su Linux, SPEC
#   §14.2) e i check TCC/plist sono Darwin-only (SPEC §14.4), quindi la suite
#   gira col binario reale anche su Linux — ed è così che i test vogliono girare
#   da 0.3.0 in poi.
#   Storia: fino a 0.2.x il check era fisso su `fsevents_monitor`, che su Linux
#   `fswatch -M` non riporta (è il monitor FSEvents di macOS) → `doctor` usciva
#   con 1 e `test_doctor_config_assente_warning_con_hint_non_fatale` pretendeva
#   exit 0 → 1 fallimento; per questo il job NON installava fswatch. Verificato
#   all'epoca eseguendo la suite in python:3.12-slim con e senza un fswatch
#   finto. La nota è aggiornata, non contraddetta: il package `fswatch` ESISTE
#   nei repo Debian/Ubuntu, era il check a non essere portabile.
# - il loop del daemon della **suite** usa comunque un fswatch finto (script
#   Python), non il binario reale: nessun unittest dipende dal comportamento di
#   fswatch. Eccezione, aggiunta con la matrix: lo step **E2E** (sotto) gira col
#   binario reale — è il gate che la suite da sola non può dare.
# - nessun path `/Users/...` reale: i test usano `tempfile.mkdtemp()` e
#   `$HOME` finto, quindi non toccano la home dell'utente del runner.
# - `plutil` non esiste su Linux e non serve: il lint del plist è un check
#   Darwin-only; su Linux `doctor` valida invece la unit systemd (SPEC §14.4).
# - su Linux `doctor` legge `/proc/sys/fs/inotify/max_user_watches`: check
#   informativo **non fatale**, quindi anche un runner con un limite basso fa
#   passare la suite.
# - `/var` vs `/private/var` (symlink di macOS): i test passano da
#   `os.path.realpath`, e sotto il container Linux non ci sono symlink
#   macOS-specifici da risolvere.
# - gli esempi in `examples/` contengono path `/Users/REPLACEME/...` ma sono
#   solo stringhe di parse, non vengono toccati dal filesystem.
# - install-smoke (0.7.0) gira in un job SEPARATO (vedi sotto): build wheel +
#   venv pulito + HOME temporaneo, così il suo mktemp e la sua pip non
#   interferiscono con la suite.
# - `doctor` (0.3.1) legge anche il log corrente
#   (`~/.local/state/safekeep/safekeep.log`, SPEC §14.4): nel container non
#   esiste → check "saltato" con riga ✔; il check **linger** compare solo dove
#   è installata la unit systemd, quindi qui non compare affatto. Nessuno dei
#   due è fatale.
#
# Rischio residuo (non verificabile qui, runner GitLab non raggiungibile dal
# locale): l'unico job invoca subprocess della CLI con `sys.executable`, quindi
# serve solo che l'immagine abbia python3 — `python:3.9-slim` e le altre lo
# garantiscono. Se il job fallisce con un check `doctor` mancante, controlla
# prima la presenza dei marker di `tests/test_cli.py` nel suo stdout, poi
# `fswatch -M` stampato qui sopra (deve elencare `inotify_monitor`).

test:
  # tre immagini = tre gambe (SPEC §14.6); la matrix espande `parallel: matrix`
  image: ${PYTHON_IMAGE}
  parallel:
    matrix:
      - PYTHON_IMAGE:
          - "python:3.9-slim"    # floor di requires-python
          - "python:3.12-slim"
          - "python:3.14-slim"
  script:
    # SPEC drift (0.9.0): header SPEC.md == __version__, shell sola (SPEC §14.6)
    - |
      spec_v="$(sed -n 's/^\*\*Versione:\*\* \([0-9][0-9.]*\).*/\1/p' SPEC.md | head -n1)"
      pkg_v="$(sed -n "s/^__version__ = ['\"]\([^'\"]*\)['\"].*/\1/p" safekeep/__init__.py | head -n1)"
      [ -n "$spec_v" ] && [ -n "$pkg_v" ] && [ "$spec_v" = "$pkg_v" ] || { echo "SPEC drift: spec='$spec_v' pkg='$pkg_v'"; exit 1; }
      echo "SPEC drift check ok: $spec_v"
    - python3 --version
    # procps: `-slim` non ha `pgrep`, che serve allo step E2E
    - apt-get update && apt-get install -y --no-install-recommends fswatch procps
    - fswatch --version
    - fswatch -M
    - pgrep --version
    # s3 (0.6.0): extra safekeep[s3] → botocore, così gli itest-ready S3 non
    # saltano più per import mancante (il config s3_* resta l'unico gate live)
    - python3 -m pip install ".[s3]"
    - python3 -m unittest discover -s tests
    # E2E (0.3.1): daemon live col fswatch reale, stessa gamba della suite
    - bash tests/e2e_linux.sh
    # WSL (SPEC §17.2/§14.6): il ramo WSL va esercitato DAVVERO, non solo con
    # l'env finto dei test unitari. Solo python3 + bash/grep/mktemp (immagini
    # Debian slim): nessuna dipendenza nuova. Gate = marker "WSL rilevato" +
    # exit 0 (i tre check WSL sono non fatali, un check fatale resta rosso).
    - |
      set -o pipefail
      log="$(mktemp)"
      WSL_DISTRO_NAME=SafekeepCITest bash tests/e2e_linux.sh --doctor-only | tee "$log"
      grep -F 'WSL rilevato: SafekeepCITest' "$log"

# Smoke di install standalone (0.7.0, task 7): wheel da sorgenti, venv pulito,
# HOME temporaneo → `safekeep daemon install` → unit + placeholder assenti +
# doctor best-effort; senza systemd (immagine slim) si esercita il ramo errore
# WSL. Un solo job fuori dalla matrix: la wheel si builda una volta.
install-smoke:
  image: python:3.12-slim
  script:
    # fswatch: preflight di `daemon install` è fatale con install_hint
    - apt-get update && apt-get install -y --no-install-recommends fswatch
    - bash tests/ci_daemon_install.sh

# Publish to PyPI with Trusted Publishing (OIDC = OpenID Connect, no stored
# credentials). Doc followed:
#   https://docs.pypi.org/trusted-publishers/using-a-publisher/ (GitLab CI/CD tab)
#   https://docs.gitlab.com/ci/secrets/id_token_authentication/
#
# How the upload authenticates, per those docs (verified against twine 7.0.0):
#
# - `id_tokens` asks GitLab for an OIDC ID token named `PYPI_ID_TOKEN` with
#   audience `pypi` — PyPI's expected audience (from
#   https://pypi.org/_/oidc/audience). The name is not arbitrary: twine asks
#   the `id` library for audience "pypi", which on GitLab reads the
#   `PYPI_ID_TOKEN` environment variable (<AUD>_ID_TOKEN convention).
# - `twine upload` is called with NO username/password: twine exchanges the
#   OIDC token at https://pypi.org/_/oidc/mint-token for a short-lived (15 min)
#   API token and uploads with it. No CI/CD variable or secret is needed.
# - `environment: release` must match the pending publisher registered on
#   pypi.org (Settings → Publishing); a mismatch makes PyPI reject the token
#   ("token not valid for this workflow"). The pending publisher also creates
#   the `safekeep` project on the first successful upload.
# - runs only on version tags, after the test job passes.
publish:
  stage: deploy
  image: python:3.12-slim
  # il tag di release aspetta ANCHE lo smoke di install standalone (0.7.0)
  needs: [test, install-smoke]
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v[0-9]+\.[0-9]+\.[0-9]+/'
  environment:
    name: release
    url: https://pypi.org/project/safekeep/
  id_tokens:
    PYPI_ID_TOKEN:
      # PyPI expects audience "pypi" ("testpypi" for TestPyPI)
      aud: pypi
  script:
    - python3 --version
    - python3 -m pip install -U build twine
    - python3 -m build
    - python3 -m twine check dist/*
    # no credentials passed: twine performs the OIDC exchange itself
    - python3 -m twine upload dist/*

# Dry-run upload to TestPyPI — dormant until the pending publisher on
# test.pypi.org exists (see .vault/PUBLISHING.md). Same shape as `publish`, the
# only real difference is the OIDC audience:
#
# - twine discovers the audience itself: it GETs https://test.pypi.org/_/oidc/audience
#   and gets back {"audience": "testpypi"} (https://docs.pypi.org/trusted-publishers/using-a-publisher/
#   states it explicitly: "Using audience=pypi is only correct for PyPI. For TestPyPI,
#   the correct audience is testpypi.").
# - it then asks the `id` library for that credential; on GitLab CI/CD `id` reads the
#   environment variable built from the audience as <AUD>_ID_TOKEN, i.e. TESTPYPI_ID_TOKEN —
#   which is exactly the id_token name declared below (source: di/id, id/_internal/oidc/ambient.py,
#   detect_gitlab()).
# - the exchange happens at https://test.pypi.org/_/oidc/mint-token, then the short-lived
#   API token is used for the upload; no stored secret anywhere.
# - `environment: release` matches the pending publisher the user has to create on
#   test.pypi.org (Settings → Publishing), same 5 fields as production.
#
# Never runs by itself: `when: manual`. The publisher on test.pypi.org does not exist
# yet, so this job is expected to fail with `token not valid for this workflow` until
# that one-time setup is done — that is the signal to register it, not a CI bug.
publish-test:
  stage: deploy
  image: python:3.12-slim
  needs: [test, install-smoke]
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v[0-9]+\.[0-9]+\.[0-9]+/'
      when: manual
  environment:
    name: release
    url: https://test.pypi.org/project/safekeep/
  id_tokens:
    TESTPYPI_ID_TOKEN:
      # TestPyPI expects audience "testpypi" ("pypi" on production PyPI)
      aud: testpypi
  script:
    - python3 --version
    - python3 -m pip install -U build twine
    - python3 -m build
    - python3 -m twine check dist/*
    # no credentials passed: twine performs the OIDC exchange against test.pypi.org
    - python3 -m twine upload --repository-url https://test.pypi.org/legacy/ dist/*
