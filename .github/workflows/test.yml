# Same contract as the `test` job in .gitlab-ci.yml: run the unittest suite on
# a stock Linux runner with Python. fswatch IS installed since 0.3.0 — `doctor`
# looks for the platform monitor (`fsevents_monitor` on Darwin, `inotify_monitor`
# on Linux) and its TCC/plist checks are Darwin-only, so the suite runs against
# the real binary here too (see the portability note in .gitlab-ci.yml).
#
# Three legs since 0.3.1 (matrix, SPEC §14.6): 3.9 is the floor declared by
# `requires-python`, 3.12 and 3.14 complete the classifier set of
# `pyproject.toml` — the CI now covers those versions too, not only the local
# suite. `fail-fast: false` so a red leg still reports alongside the others.
#
# Plus the E2E (end-to-end) step that .gitlab-ci.yml could not show us before
# 0.3.1: a LIVE daemon on Linux with the real fswatch (inotify), a real copy
# into a tmp dest, the `.sync` exclusions under live events, `doctor --config`
# exit 0 and a clean shutdown with no `*.safekeep.tmp.*` residue. That step is
# the gate — every unittest drives a fake fswatch (see tests/e2e_linux.sh
# header). It runs on EVERY leg, floor included.
#
# One job, not two: the suite and the E2E share the checkout, the Python and
# the `apt-get install fswatch`, and a step-level failure already names the
# phase that broke (GH = GitHub Actions).
#
# E2E SMB (0.9.0, SPEC §14.6/§20): tests/e2e_smb.sh mounts a guest CIFS
# share (private smbd + mount.cifs) in a mktemp sandbox and drives the
# network-volume path for real (dest on CIFS, source on CIFS under the
# polling monitor, umount/remount catch-up). Gate is MANDATORY on the 3.12
# leg only (SAFEKEEP_E2E_SMB=1, samba + cifs-utils installed): an identical
# run on three legs covers nothing extra and costs three runners. Declared
# divergence with .gitlab-ci.yml: the GitLab docker executor has no
# SYS_ADMIN, mount.cifs cannot mount there — GitLab does NOT run this e2e
# (same prassi as pgrep/procps: what the runner cannot do, the CI declares
# and skips).
#
# Action majors: checkout@v7 + setup-python@v7 — both run on the node24 runtime
# (`runs.using: node24`, verified against the upstream action.yml in 2026-10);
# the old v4/v5 ran on node20, which GH now flags as deprecated.
name: tests

on:
  push:
    branches: [main, docs]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.9', '3.12', '3.14']
    steps:
      - uses: actions/checkout@v7
      # SPEC drift (0.9.0): l'header `**Versione:**` di SPEC.md deve essere
      # uguale a `__version__` di safekeep/__init__.py — shell sola (sed+test,
      # zero dipendenze), una gamba basta, gira prima di ogni altro step
      # (SPEC §14.6; accadeva che l'header restasse stale a più release di
      # distanza dalla versione reale).
      - name: SPEC version drift check
        if: matrix.python-version == '3.12'
        run: |
          set -eu
          spec_v="$(sed -n 's/^\*\*Versione:\*\* \([0-9][0-9.]*\).*/\1/p' SPEC.md | head -n1)"
          pkg_v="$(sed -n "s/^__version__ = ['\"]\([^'\"]*\)['\"].*/\1/p" safekeep/__init__.py | head -n1)"
          if [ -z "$spec_v" ] || [ -z "$pkg_v" ]; then
            echo "SPEC drift check: header o __version__ non trovati (spec='$spec_v' pkg='$pkg_v')"
            exit 1
          fi
          if [ "$spec_v" != "$pkg_v" ]; then
            echo "SPEC drift: SPEC.md Versione=$spec_v ma __version__=$pkg_v"
            exit 1
          fi
          echo "SPEC drift check ok: $spec_v"
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install fswatch
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends fswatch
          fswatch --version
          fswatch -M
      # s3 (0.6.0): extra safekeep[s3] → botocore, così gli itest-ready S3 non
      # saltano per import mancante (stesso step del job `test` su GitLab)
      - name: Install safekeep[s3] (botocore)
        run: python3 -m pip install ".[s3]"
      - name: Run test suite
        run: |
          python3 --version
          python3 -m unittest discover -s tests
      # Live daemon: real fswatch + real copy + doctor, inside a mktemp sandbox
      # (every matrix leg, 3.9 included — procps/pgrep is preinstalled on
      # ubuntu-latest, unlike the GitLab -slim images)
      - name: E2E live daemon (Linux)
        run: bash tests/e2e_linux.sh
      # WSL branch executed for REAL (SPEC.md §14.6/§17.2): WSL_DISTRO_NAME
      # flips is_wsl() on this stock runner, so `doctor` really walks the WSL
      # block instead of the unit tests faking the env. `--doctor-only` reuses
      # the e2e sandbox (tmp source/dest/config — a missing --config is a fatal
      # check) and skips the daemon. Gate = marker printed AND exit 0: all
      # three WSL lines are non-fatal, so any fatal check still goes red.
      # Needs nothing but bash/grep/mktemp + the already installed fswatch.
      - name: WSL branch in doctor (WSL_DISTRO_NAME)
        run: |
          set -o pipefail
          log="$(mktemp)"
          WSL_DISTRO_NAME=SafekeepCITest bash tests/e2e_linux.sh --doctor-only | tee "$log"
          grep -F 'WSL rilevato: SafekeepCITest' "$log"
      # 0.7.0 (task 7): smoke di install standalone — build della wheel, venv
      # pulito + HOME temporaneo → `safekeep daemon install` → unit presente,
      # nessun placeholder residuo, config chmod 600, doctor best-effort.
      # NESSUNA operazione che avvii/fermi un agent (vedi header di
      # tests/ci_daemon_install.sh). Su questo runner systemd c'è → ramo WSL
      # esercitato solo nei job senza systemd (GitLab -slim) e dai test unit.
      - name: Daemon install smoke (wheel + clean venv)
        run: bash tests/ci_daemon_install.sh
      # E2E SMB/CIFS (0.9.0, SPEC §20): gate reale per i volumi di rete —
      # smbd guest locale + mount.cifs dentro una sandbox mktemp. OBBLIGATORIO
      # su questa gamba: se il mount fallisce il job va rosso. Una gamba basta
      # (3.12): un identico test su tre gambe non copre nulla in più e costa
      # tre runner. GitLab NON lo fa (docker executor senza SYS_ADMIN): la
      # divergenza è dichiarata nei commenti di testa di entrambi i file.
      - name: SMB e2e (samba + cifs-utils)
        if: matrix.python-version == '3.12'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends samba cifs-utils
          SAFEKEEP_E2E_SMB=1 bash tests/e2e_smb.sh || {
            echo "--- dmesg CIFS/SMB (diagnostica mount) ---"
            sudo dmesg | grep -iE "cifs|smb" | tail -25 || true
            echo "--- mount table ---"
            mount | grep -i cifs || true
            exit 1
          }
