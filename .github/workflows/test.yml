# Same contract as the `test` job in .gitlab-ci.yml: run the unittest suite on
# a stock Linux runner with Python. fswatch IS installed since 0.3.0 — `doctor`
# looks for the platform monitor (`fsevents_monitor` on Darwin, `inotify_monitor`
# on Linux) and its TCC/plist checks are Darwin-only, so the suite runs against
# the real binary here too (see the portability note in .gitlab-ci.yml).
#
# Three legs since 0.3.1 (matrix, SPEC §14.6): 3.9 is the floor declared by
# `requires-python`, 3.12 and 3.14 complete the classifier set of
# `pyproject.toml` — the CI now covers those versions too, not only the local
# suite. `fail-fast: false` so a red leg still reports alongside the others.
#
# Plus the E2E (end-to-end) step that .gitlab-ci.yml could not show us before
# 0.3.1: a LIVE daemon on Linux with the real fswatch (inotify), a real copy
# into a tmp dest, the `.sync` exclusions under live events, `doctor --config`
# exit 0 and a clean shutdown with no `*.safekeep.tmp.*` residue. That step is
# the gate — every unittest drives a fake fswatch (see tests/e2e_linux.sh
# header). It runs on EVERY leg, floor included.
#
# One job, not two: the suite and the E2E share the checkout, the Python and
# the `apt-get install fswatch`, and a step-level failure already names the
# phase that broke (GH = GitHub Actions).
#
# Action majors: checkout@v7 + setup-python@v7 — both run on the node24 runtime
# (`runs.using: node24`, verified against the upstream action.yml in 2026-10);
# the old v4/v5 ran on node20, which GH now flags as deprecated.
name: tests

on:
  push:
    branches: [main, docs]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.9', '3.12', '3.14']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install fswatch
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends fswatch
          fswatch --version
          fswatch -M
      - name: Run test suite
        run: |
          python3 --version
          python3 -m unittest discover -s tests
      # Live daemon: real fswatch + real copy + doctor, inside a mktemp sandbox
      # (every matrix leg, 3.9 included — procps/pgrep is preinstalled on
      # ubuntu-latest, unlike the GitLab -slim images)
      - name: E2E live daemon (Linux)
        run: bash tests/e2e_linux.sh
      # WSL branch executed for REAL (SPEC.md §14.6/§17.2): WSL_DISTRO_NAME
      # flips is_wsl() on this stock runner, so `doctor` really walks the WSL
      # block instead of the unit tests faking the env. `--doctor-only` reuses
      # the e2e sandbox (tmp source/dest/config — a missing --config is a fatal
      # check) and skips the daemon. Gate = marker printed AND exit 0: all
      # three WSL lines are non-fatal, so any fatal check still goes red.
      # Needs nothing but bash/grep/mktemp + the already installed fswatch.
      - name: WSL branch in doctor (WSL_DISTRO_NAME)
        run: |
          set -o pipefail
          log="$(mktemp)"
          WSL_DISTRO_NAME=SafekeepCITest bash tests/e2e_linux.sh --doctor-only | tee "$log"
          grep -F 'WSL rilevato: SafekeepCITest' "$log"
